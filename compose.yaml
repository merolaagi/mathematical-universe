services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "127.0.0.1:18474:7474"
      - "127.0.0.1:18687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Run python3 scripts/start.py first}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - math-data:/data
volumes:
  math-data:
